<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Story Time!</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #fff4b8 0%, transparent 30%),
                radial-gradient(circle at top right, #c9f4ff 0%, transparent 30%),
                linear-gradient(180deg, #eef9ff 0%, #f8f5ff 100%);

            color: #243b53;

            user-select: none;
            -webkit-user-select: none;

            padding-bottom: 145px;
        }

        /* =========================
           HEADER
        ========================== */

        header {
            text-align: center;
            padding: 28px 20px 20px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            background: white;

            padding: 10px 22px;

            border-radius: 50px;

            box-shadow:
                0 8px 25px rgba(50, 70, 90, 0.10);
        }

        .logo-icon {
            font-size: 2rem;
        }

        h1 {
            margin: 0;

            font-size: 2rem;

            font-weight: 800;

            color: #243b53;
        }

        .subtitle {
            margin: 14px 0 0;

            font-size: 1.05rem;

            color: #627d98;
        }


        /* =========================
           CATEGORY BUTTONS
        ========================== */

        .categories {
            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding: 10px 20px 20px;

            justify-content: center;
        }

        .category {
            border: none;

            background: white;

            padding: 10px 18px;

            border-radius: 30px;

            font-size: 0.95rem;

            font-weight: 700;

            color: #486581;

            box-shadow:
                0 5px 15px rgba(50, 70, 90, 0.08);

            white-space: nowrap;
        }

        .category.active {
            background: #4c6fff;

            color: white;
        }


        /* =========================
           STORY GRID
        ========================== */

        .story-grid {
            width: 100%;

            max-width: 1050px;

            margin: 0 auto;

            padding: 0 18px 30px;

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }


        /* =========================
           STORY CARD
        ========================== */

        .story-card {
            position: relative;

            background: white;

            border-radius: 28px;

            padding: 14px;

            border: 5px solid transparent;

            box-shadow:
                0 10px 25px rgba(50, 70, 90, 0.10);

            cursor: pointer;

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;

            overflow: hidden;
        }

        .story-card:active {
            transform: scale(0.96);
        }


        /* Card colors */

        .story-card.bluey {
            background:
                linear-gradient(145deg, #d9f5ff, #ffffff);

            border-color: #70cfff;
        }

        .story-card.minions {
            background:
                linear-gradient(145deg, #fff5a8, #ffffff);

            border-color: #ffd84d;
        }

        .story-card.frozen {
            background:
                linear-gradient(145deg, #dff8ff, #ffffff);

            border-color: #82d9ff;
        }

        .story-card.minecraft {
            background:
                linear-gradient(145deg, #dff5d5, #ffffff);

            border-color: #7cc576;
        }


        /* =========================
           STORY IMAGE
        ========================== */

        .story-image {
            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            border-radius: 22px;

            overflow: hidden;

            background: #e8eef3;
        }

        .story-image img {
            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            pointer-events: none;
        }


        /* =========================
           CARD PLAY BUTTON
        ========================== */

        .play-button {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 68px;
            height: 68px;

            border-radius: 50%;

            border: 4px solid white;

            background:
                rgba(76, 111, 255, 0.94);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            padding-left: 4px;

            box-shadow:
                0 6px 18px rgba(0,0,0,0.22);
        }


        /* =========================
           STORY INFORMATION
        ========================== */

        .story-info {
            padding: 12px 5px 5px;

            text-align: center;
        }

        .story-title {
            font-size: 1.15rem;

            font-weight: 800;

            color: #243b53;
        }

        .story-type {
            font-size: 0.85rem;

            margin-top: 3px;

            color: #829ab1;
        }


        /* =========================
           LOADING
        ========================== */

        .story-card.loading {
            border-color: #f6c344;

            transform: scale(1.02);
        }

        .story-card.loading .play-button {
            background: #f6c344;

            animation:
                spinPulse 1.2s infinite;
        }

        @keyframes spinPulse {

            0% {
                transform:
                    translate(-50%, -50%) scale(1);
            }

            50% {
                transform:
                    translate(-50%, -50%) scale(1.12);
            }

            100% {
                transform:
                    translate(-50%, -50%) scale(1);
            }
        }


        /* =========================
           PLAYING
        ========================== */

        .story-card.playing {
            border-color: #48bb78;

            transform: scale(1.02);

            box-shadow:
                0 10px 30px rgba(72, 187, 120, 0.25);
        }

        .story-card.playing .play-button {
            background: #48bb78;

            padding-left: 0;
        }


        /* =========================
           BOTTOM PLAYER
        ========================== */

        .player {
            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            background:
                rgba(255,255,255,0.97);

            backdrop-filter: blur(12px);

            border-top:
                1px solid #d9e2ec;

            padding:
                14px 18px 16px;

            box-shadow:
                0 -8px 25px rgba(50,70,90,0.12);

            z-index: 100;
        }

        .player-inner {
            max-width: 1050px;

            margin: auto;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        /* =========================
           PROGRESS BAR
        ========================== */

        .progress-area {
            position: absolute;

            left: 0;
            right: 0;

            top: -5px;

            height: 5px;

            background: #e5e7eb;

            cursor: pointer;
        }

        .progress-bar {
            height: 100%;

            width: 0%;

            background: #4c6fff;

            transition:
                width 0.1s linear;
        }


        /* =========================
           PLAYER ART
        ========================== */

        .player-art {
            width: 58px;
            height: 58px;

            flex-shrink: 0;

            border-radius: 15px;

            overflow: hidden;

            background: #e8eef3;
        }

        .player-art img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =========================
           PLAYER INFO
        ========================== */

        .player-info {
            flex: 1;

            min-width: 90px;
        }

        .now-playing {
            font-size: 0.75rem;

            color: #829ab1;

            font-weight: 700;
        }

        .current-title {
            font-size: 1rem;

            font-weight: 800;

            color: #243b53;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .time-display {
            font-size: 0.72rem;

            color: #829ab1;

            margin-top: 2px;
        }


        /* =========================
           REWIND / FORWARD BUTTONS
        ========================== */

        .skip-button {
            border: none;

            background: #edf2f7;

            color: #334e68;

            width: 52px;
            height: 52px;

            border-radius: 50%;

            flex-shrink: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .skip-button:active {
            transform: scale(0.88);

            background: #d9e2ec;
        }

        .skip-icon {
            font-size: 19px;

            line-height: 18px;
        }

        .skip-text {
            font-size: 8px;

            margin-top: 2px;
        }


        /* =========================
           MAIN PLAY BUTTON
        ========================== */

        .main-play {
            width: 56px;
            height: 56px;

            flex-shrink: 0;

            border: none;

            border-radius: 50%;

            background: #4c6fff;

            color: white;

            font-size: 24px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;
        }


        /* =========================
           DESKTOP
        ========================== */

        @media (min-width: 700px) {

            header {
                padding-top: 40px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .story-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

                gap: 22px;
            }

            .story-card {
                padding: 16px;
            }
        }


        @media (min-width: 1000px) {

            .story-grid {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 500px) {

            body {
                padding-bottom: 125px;
            }

            header {
                padding-top: 20px;
            }

            .logo {
                padding: 8px 18px;
            }

            h1 {
                font-size: 1.65rem;
            }

            .subtitle {
                font-size: 0.95rem;
            }

            .categories {
                justify-content: flex-start;
            }

            .story-grid {
                gap: 13px;

                padding-left: 13px;
                padding-right: 13px;
            }

            .story-card {
                border-radius: 22px;

                border-width: 4px;

                padding: 9px;
            }

            .story-image {
                border-radius: 16px;
            }

            .play-button {
                width: 55px;
                height: 55px;

                font-size: 24px;
            }

            .story-title {
                font-size: 1rem;
            }

            .story-type {
                font-size: 0.75rem;
            }

            .player {
                padding:
                    10px 10px 13px;
            }

            .player-inner {
                gap: 7px;
            }

            .player-art {
                width: 46px;
                height: 46px;

                border-radius: 12px;
            }

            .skip-button {
                width: 46px;
                height: 46px;
            }

            .main-play {
                width: 48px;
                height: 48px;
            }

            .current-title {
                font-size: 0.9rem;
            }
        }

    </style>
</head>

    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        let currentAudio = null;

        let currentCard = null;


        const progressBar =
            document.getElementById("progressBar");

        const progressArea =
            document.getElementById("progressArea");

        const currentTitle =
            document.getElementById("currentTitle");

        const playerImage =
            document.getElementById("playerImage");

        const mainPlay =
            document.getElementById("mainPlay");

        const timeDisplay =
            document.getElementById("timeDisplay");


        /* =========================
           FORMAT TIME
        ========================== */

        function formatTime(seconds) {

            if (!isFinite(seconds)) {
                return "0:00";
            }

            seconds = Math.floor(seconds);

            const minutes =
                Math.floor(seconds / 60);

            const remainingSeconds =
                seconds % 60;

            return (
                minutes +
                ":" +
                String(remainingSeconds).padStart(2, "0")
            );
        }


        /* =========================
           PLAY STORY
        ========================== */

        function handleCardClick(
            audioId,
            cardElement
        ) {

            const selectedAudio =
                document.getElementById(audioId);


            /*
             * Story has no audio yet.
             */

            if (
                !selectedAudio.src ||
                selectedAudio.getAttribute("src") === ""
            ) {

                alert(
                    "This story isn't available yet!"
                );

                return;
            }


            /*
             * SAME STORY
             */

            if (
                currentAudio === selectedAudio
            ) {

                if (
                    !selectedAudio.paused
                ) {

                    selectedAudio.pause();

                } else {

                    selectedAudio.play();

                }

                return;
            }


            /*
             * STOP OLD STORY
             */

            if (currentAudio) {

                currentAudio.pause();

                currentAudio.currentTime = 0;

                if (currentCard) {

                    currentCard.classList.remove(
                        "playing",
                        "loading"
                    );

                    const oldButton =
                        currentCard.querySelector(
                            ".play-button"
                        );

                    if (oldButton) {

                        oldButton.textContent =
                            "▶";
                    }
                }
            }


            /*
             * SET NEW STORY
             */

            currentAudio =
                selectedAudio;

            currentCard =
                cardElement;


            /*
             * UPDATE PLAYER
             */

            const title =
                cardElement
                    .querySelector(
                        ".story-title"
                    )
                    .textContent;

            const image =
                cardElement
                    .querySelector("img")
                    .src;

            currentTitle.textContent =
                title;

            playerImage.src =
                image;


            progressBar.style.width =
                "0%";

            timeDisplay.textContent =
                "0:00 / 0:00";


            /*
             * LOADING
             */

            cardElement.classList.add(
                "loading"
            );


            /*
             * PLAYING
             */

            selectedAudio.onplaying =
                function () {

                    cardElement.classList.remove(
                        "loading"
                    );

                    cardElement.classList.add(
                        "playing"
                    );

                    const button =
                        cardElement.querySelector(
                            ".play-button"
                        );

                    if (button) {

                        button.textContent =
                            "⏸";
                    }

                    mainPlay.textContent =
                        "⏸";
                };


            /*
             * PAUSED
             */

            selectedAudio.onpause =
                function () {

                    if (
                        currentAudio ===
                        selectedAudio
                    ) {

                        cardElement.classList.remove(
                            "playing"
                        );

                        const button =
                            cardElement.querySelector(
                                ".play-button"
                            );

                        if (button) {

                            button.textContent =
                                "▶";
                        }

                        mainPlay.textContent =
                            "▶";
                    }
                };


            /*
             * TIME / PROGRESS
             */

            selectedAudio.ontimeupdate =
                function () {

                    if (
                        selectedAudio.duration
                    ) {

                        const percent =
                            (
                                selectedAudio.currentTime /
                                selectedAudio.duration
                            ) * 100;

                        progressBar.style.width =
                            percent + "%";

                        timeDisplay.textContent =
                            formatTime(
                                selectedAudio.currentTime
                            )
                            +
                            " / "
                            +
                            formatTime(
                                selectedAudio.duration
                            );
                    }
                };


            /*
             * STORY FINISHED
             */

            selectedAudio.onended =
                function () {

                    cardElement.classList.remove(
                        "playing",
                        "loading"
                    );

                    const button =
                        cardElement.querySelector(
                            ".play-button"
                        );

                    if (button) {

                        button.textContent =
                            "▶";
                    }

                    progressBar.style.width =
                        "0%";

                    mainPlay.textContent =
                        "▶";

                    currentAudio = null;

                    currentCard = null;
                };


            /*
             * ERROR
             */

            selectedAudio.onerror =
                function () {

                    alert(
                        "Oops! We couldn't load this story right now."
                    );

                    cardElement.classList.remove(
                        "playing",
                        "loading"
                    );

                    mainPlay.textContent =
                        "▶";

                    currentAudio = null;

                    currentCard = null;
                };


            /*
             * START
             */

            selectedAudio
                .play()
                .catch(function(error) {

                    console.log(
                        "Playback interrupted:",
                        error
                    );

                    cardElement.classList.remove(
                        "loading"
                    );

                });

        }


        /* =========================
           PLAY / PAUSE
        ========================== */

        function toggleCurrentAudio() {

            if (!currentAudio) {
                return;
            }

            if (
                currentAudio.paused
            ) {

                currentAudio.play();

            } else {

                currentAudio.pause();
            }
        }


        /* =========================
           REWIND 15 SECONDS
        ========================== */

        function skipBackward(event) {

            event.stopPropagation();

            if (!currentAudio) {
                return;
            }

            currentAudio.currentTime =
                Math.max(
                    0,
                    currentAudio.currentTime - 15
                );
        }


        /* =========================
           FORWARD 15 SECONDS
        ========================== */

        function skipForward(event) {

            event.stopPropagation();

            if (!currentAudio) {
                return;
            }

            currentAudio.currentTime =
                Math.min(
                    currentAudio.duration,
                    currentAudio.currentTime + 15
                );
        }


        /* =========================
           CLICK PROGRESS BAR
        ========================== */

        function seekAudio(event) {

            if (!currentAudio) {
                return;
            }

            if (!currentAudio.duration) {
                return;
            }

            const rect =
                progressArea.getBoundingClientRect();

            const clickPosition =
                event.clientX - rect.left;

            const percentage =
                clickPosition / rect.width;

            currentAudio.currentTime =
                percentage *
                currentAudio.duration;
        }


        /* =========================
           CATEGORY BUTTONS
        ========================== */

        document
            .querySelectorAll(".category")
            .forEach(function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        document
                            .querySelectorAll(
                                ".category"
                            )
                            .forEach(
                                function(btn) {

                                    btn.classList.remove(
                                        "active"
                                    );

                                }
                            );

                        button.classList.add(
                            "active"
                        );

                    }
                );

            });

    </script>

</body>
</html>
